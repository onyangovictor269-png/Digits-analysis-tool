<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Matches & Differs Digit Analyzer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b0e14; color: #e6edf3; padding: 15px; margin: 0; }
        .container { max-width: 100%; margin: auto; background: #161b22; padding: 20px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 1px solid #30363d; }
        h2 { text-align: center; color: #58a6ff; margin-bottom: 5px; font-size: 22px; }
        .subtitle { text-align: center; color: #8b949e; font-size: 12px; margin-bottom: 15px; }
        
        .controls { background: #21262d; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        select { background: #0d1117; color: #fff; border: 1px solid #30363d; padding: 8px; border-radius: 6px; font-size: 14px; width: 100%; outline: none; }
        
        .status { text-align: center; font-size: 13px; font-weight: 500; margin-bottom: 15px; padding: 8px; border-radius: 6px; background: #1f242c; }
        .connected { color: #3fb950; }
        .disconnected { color: #f85149; }

        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        @media (min-width: 500px) { .stats-grid { grid-template-columns: repeat(5, 1fr); } }

        .digit-box { background: #21262d; padding: 12px 8px; text-align: center; border-radius: 8px; border: 1px solid #30363d; }
        .digit-number { font-size: 24px; font-weight: bold; color: #7ee787; }
        .digit-count { font-size: 12px; color: #8b949e; margin-top: 3px; }
        .digit-pct { font-size: 13px; font-weight: 600; color: #58a6ff; margin-top: 2px; }

        /* Highlights */
        .highlight-differs { border-color: #f0883e !important; background: #2a2015 !important; }
        .highlight-matches { border-color: #3fb950 !important; background: #15261c !important; }

        .recommendation { background: #1f2937; border-left: 4px solid #58a6ff; padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 13px; line-height: 1.4; }
        .rec-title { font-weight: bold; color: #58a6ff; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Deriv Digit Analyzer</h2>
        <div class="subtitle">Matches & Differs Statistical Monitor</div>

        <div class="controls">
            <div>
                <label for="symbolSelect" style="font-size: 13px; color: #8b949e;">Market Index:</label>
            </div>
            <select id="symbolSelect" onchange="changeMarket()">
                <option value="R_10">Volatility 10 Index</option>
                <option value="R_25">Volatility 25 Index</option>
                <option value="R_50">Volatility 50 Index</option>
                <option value="R_75">Volatility 75 Index</option>
                <option value="R_100" selected>Volatility 100 Index</option>
            </select>
            <div id="sampleInfo" style="font-size: 12px; color: #8b949e; text-align: right;">Rolling Window: 100 Ticks</div>
        </div>

        <div id="status" class="status disconnected">Connecting to Deriv WebSocket...</div>

        <div class="stats-grid" id="grid">
            <!-- Dynamically generated digit cards -->
        </div>

        <div class="recommendation" id="recBox">
            <div class="rec-title">Live Strategy Insight</div>
            <div id="recText">Waiting for sufficient tick data to calculate frequency distribution...</div>
        </div>
    </div>

    <script>
        const appId = 1089;
        let currentSymbol = 'R_100';
        const maxTicks = 100;
        let tickHistory = [];
        let digitCounts = Array(10).fill(0);
        let ws;

        function connectWebSocket() {
            ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${appId}`);

            ws.onopen = function() {
                const statusEl = document.getElementById('status');
                statusEl.className = 'status connected';
                statusEl.innerText = `Connected (${currentSymbol})`;
                ws.send(JSON.stringify({ ticks: currentSymbol }));
            };

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.msg_type === 'tick') {
                    const price = data.tick.quote.toString();
                    const lastDigit = parseInt(price.slice(-1));

                    tickHistory.push(lastDigit);
                    digitCounts[lastDigit]++;

                    if (tickHistory.length > maxTicks) {
                        const removedDigit = tickHistory.shift();
                        digitCounts[removedDigit]--;
                    }

                    updateUI();
                }
            };

            ws.onerror = function() {
                const statusEl = document.getElementById('status');
                statusEl.className = 'status disconnected';
                statusEl.innerText = 'Connection Error. Reconnecting...';
            };

            ws.onclose = function() {
                const statusEl = document.getElementById('status');
                statusEl.className = 'status disconnected';
                statusEl.innerText = 'Disconnected.';
            };
        }

        function changeMarket() {
            if (ws) ws.close();
            currentSymbol = document.getElementById('symbolSelect').value;
            tickHistory = [];
            digitCounts = Array(10).fill(0);
            connectWebSocket();
        }

        function updateUI() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            let minCount = Infinity;
            let maxCount = -1;
            let coldestDigits = [];
            let hottestDigits = [];

            if (tickHistory.length >= 20) {
                for (let i = 0; i < 10; i++) {
                    if (digitCounts[i] < minCount) {
                        minCount = digitCounts[i];
                        coldestDigits = [i];
                    } else if (digitCounts[i] === minCount) {
                        coldestDigits.push(i);
                    }

                    if (digitCounts[i] > maxCount) {
                        maxCount = digitCounts[i];
                        hottestDigits = [i];
                    } else if (digitCounts[i] === maxCount) {
                        hottestDigits.push(i);
                    }
                }
            }

            for (let i = 0; i < 10; i++) {
                const count = digitCounts[i];
                const percentage = tickHistory.length > 0 ? ((count / tickHistory.length) * 100).toFixed(1) : 0;
                
                let boxClass = 'digit-box';
                if (tickHistory.length >= 20) {
                    if (coldestDigits.includes(i)) boxClass += ' highlight-differs';
                    if (hottestDigits.includes(i)) boxClass += ' highlight-matches';
                }

                const box = document.createElement('div');
                box.className = boxClass;
                box.innerHTML = `
                    <div class="digit-number">${i}</div>
                    <div class="digit-count">${count} hits</div>
                    <div class="digit-pct">${percentage}%</div>
                `;
                grid.appendChild(box);
            }

            if (tickHistory.length >= 20) {
                document.getElementById('recText').innerHTML = 
                    `Last <b>${tickHistory.length}</b> ticks analyzed:<br>` +
                    `• <b>Coldest [Differs]:</b> <span style="color:#f0883e">${coldestDigits.join(', ')}</span> (${((minCount/tickHistory.length)*100).toFixed(1)}%)<br>` +
                    `• <b>Hottest [Matches]:</b> <span style="color:#3fb950">${hottestDigits.join(', ')}</span> (${((maxCount/tickHistory.length)*100).toFixed(1)}%)`;
            }
        }

        connectWebSocket();
    </script>
</body>
</html>
